<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat test</title>
  <style>
    body { font: 16px/1.5 system-ui, sans-serif; max-width: 720px; margin: 24px auto; padding: 0 16px; }
    form, .row { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0; }
    input[name=question] { flex: 1; min-width: 200px; }
    h2 { font-size: 18px; margin: 24px 0 8px; }
    h3 { font-size: 15px; margin: 16px 0 4px; color: #444; }
    p { margin: 4px 0; }
    .who { font-weight: 600; }
    .muted { color: #666; font-size: 14px; }
    li button, p button { margin-left: 8px; font-size: 13px; }
  </style>
</head>
<body>
  <h1>대화 테스트</h1>
  <p class="muted">게임 화면이 아니라 연결 확인용 페이지입니다. 기록은 이 브라우저에만 저장됩니다.</p>

  <div class="row">
    <label>시점 <select id="timepoint"></select></label>
    <label>인물 <select id="character"></select></label>
    <button id="reset" type="button">새 게임</button>
  </div>
  <form id="ask">
    <input name="question" placeholder="질문을 입력하세요" required maxlength="500" autocomplete="off">
    <button>보내기</button>
  </form>
  <p id="error" class="muted"></p>

  <h2>핀한 카드 <span class="muted">(질문할 때 증거로 함께 보냅니다, 최대 10장)</span></h2>
  <ul id="pins"></ul>

  <h2>사건 기록 <span class="muted">(모든 시점, 게임 속 시각 순)</span></h2>
  <div id="log"></div>

  <script type="module">
    import { loadGame, newGame, ask, pin, unpin, caseLog } from "/client/game.js";

    const { timepoints, characters } = await (await fetch("/api/characters")).json();
    const names = Object.fromEntries(Object.entries(characters).map(([id, c]) => [id, c.name]));
    const labels = Object.fromEntries(timepoints.map((t) => [t.id, t.label]));
    const tpSel = document.getElementById("timepoint");
    const charSel = document.getElementById("character");
    const pinsEl = document.getElementById("pins");
    const logEl = document.getElementById("log");
    const errorEl = document.getElementById("error");
    let game = loadGame();

    tpSel.append(...timepoints.map((t) => new Option(t.label, t.id)));
    tpSel.value = "T2016";
    function fillCharacters() {
      charSel.replaceChildren(
        ...Object.entries(characters).filter(([, c]) => c.timepoints.includes(tpSel.value)).map(([id, c]) => new Option(c.name, id)),
      );
    }
    tpSel.onchange = fillCharacters;
    fillCharacters();

    function button(text, onclick) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = text;
      b.onclick = onclick;
      return b;
    }

    function render() {
      pinsEl.replaceChildren(
        ...game.pins.map((card) => {
          const li = document.createElement("li");
          li.append(card, button("빼기", () => { unpin(game, card); render(); }));
          return li;
        }),
      );
      logEl.replaceChildren();
      let current = null;
      for (const t of caseLog(game)) {
        if (t.timepoint !== current) {
          current = t.timepoint;
          const h = document.createElement("h3");
          h.textContent = labels[current] || current;
          logEl.append(h);
        }
        const q = document.createElement("p");
        q.className = "muted";
        q.textContent = `서진 → ${names[t.character] || t.character}: ${t.question}`;
        const a = document.createElement("p");
        const who = document.createElement("span");
        who.className = "who";
        who.textContent = `${names[t.character] || t.character}: `;
        a.append(who, t.answer, button("핀", () => { if (!pin(game, t, names)) errorEl.textContent = "이미 핀했거나 10장이 찼습니다."; render(); }));
        logEl.append(q, a);
      }
    }
    render();

    document.getElementById("reset").onclick = () => { game = newGame(); errorEl.textContent = ""; render(); };

    document.getElementById("ask").onsubmit = async (event) => {
      event.preventDefault();
      const form = event.target;
      const question = form.question.value.trim();
      if (!question) return;
      form.question.value = "";
      form.querySelector("button").disabled = true;
      errorEl.textContent = "";
      try {
        await ask(game, charSel.value, tpSel.value, question);
        render();
      } catch (e) {
        errorEl.textContent = `오류: ${e.message}`;
      } finally {
        form.querySelector("button").disabled = false;
      }
    };
  </script>
</body>
</html>
