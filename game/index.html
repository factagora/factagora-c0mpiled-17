<!doctype html>
<html lang="en" data-screen="map">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>11:23</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
/* layout: pixel night sky behind; double-line "windows" float on top — HUD boxes, a map window + a menu window, a case-file dialogue box at the bottom */
:root{
  --sky1:#0d0930; --sky2:#2a1f86; --sea:#120e4c;
  --panel:rgba(11,9,44,.88); --solid:#0b092c; --fg:#eceaff; --muted:#a3a0dc; --dim:#6f6cab;
  --gold:#f5c451; --cyan:#7fd6ff; --red:#ff6b7f; --portrait:#2c3aa8; --skin:#e2ae86;
  --px:'DotGothic16','MS Gothic','Osaka-Mono',ui-monospace,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--sky1);color:var(--fg);font-family:var(--px);font-size:17px;line-height:1.6;-webkit-font-smoothing:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--sky1)}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;image-rendering:pixelated}
#noise{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:65;opacity:0;image-rendering:pixelated;transition:opacity .25s}
.scanlines{position:fixed;inset:0;pointer-events:none;z-index:70;background:repeating-linear-gradient(0deg,rgba(0,0,0,.12) 0 1px,transparent 1px 3px)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.wrap{position:relative;z-index:1;max-width:1280px;margin:0 auto;box-sizing:border-box;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 40px}
h1,h2,h3{font-weight:400;margin:0;text-wrap:balance}

/* the window frame: outer thick line, gap, inner thin line */
.win{position:relative;background:var(--panel);border:3px solid var(--fg);box-shadow:inset 0 0 0 4px var(--solid),inset 0 0 0 6px var(--fg),0 0 0 3px var(--solid);padding:22px 24px;box-sizing:border-box;min-width:0}
.wtitle{color:var(--gold);letter-spacing:.08em;text-transform:uppercase;font-size:clamp(18px,2vw,24px)}
.tablabel{position:absolute;top:-30px;left:36px;padding:4px 18px;font-size:clamp(17px,2vw,22px);color:var(--gold);letter-spacing:.08em}
.tablabel.win{padding:6px 20px}
.muted{color:var(--muted)}
/* HUD */
#hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:50}
#hud .wrap{padding-block:16px 6px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:14px}
.timebox{padding:12px 22px 14px;display:flex;flex-direction:column;gap:8px}
.timebox .tt{font-size:clamp(20px,2.4vw,28px);color:var(--gold);letter-spacing:.06em;font-variant-numeric:tabular-nums}
.bars{display:flex;gap:8px;align-items:center}
.bars i{display:block;width:36px;height:8px;background:var(--dim)}
.bars i.on{background:var(--gold);width:60px}
.bars i.on26{background:var(--cyan);width:60px}
.navbox{padding:12px 22px;display:flex;align-items:center;gap:14px;font-size:clamp(17px,2vw,22px);text-transform:uppercase;letter-spacing:.04em}
.navbox button{background:transparent;border:0;padding:4px 2px;min-height:40px}
.navbox button:hover,.navbox button[aria-current="true"]{color:var(--gold)}
.navbox .sep{color:var(--muted)}

/* screens */
.screen{animation:enter .5s steps(6)}
@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* portrait tile */
.ph{--suit:#3b2f7a;position:relative;background:radial-gradient(circle at 50% 40%,var(--skin) 0 19%,transparent 20%),radial-gradient(circle at 50% 30%,var(--hair,#2a1d14) 0 23%,transparent 24%),radial-gradient(ellipse at 50% 108%,var(--suit) 0 46%,transparent 47%),var(--portrait);border:3px solid var(--fg);box-sizing:border-box;display:flex;align-items:flex-end;justify-content:flex-end;padding:2px 4px;font-size:12px;color:var(--fg);image-rendering:pixelated}
.pol{position:relative;background:transparent;border:0;padding:24px 0 0;display:flex;flex-direction:column;align-items:center;gap:6px;width:104px;font-size:16px;transition:transform .15s steps(2)}
.pol .ph{width:96px;height:96px}
.pol:hover{transform:translateY(-3px)}
.pol:hover .ph{border-color:var(--gold)}
.pol.done{color:var(--muted)}
.pol.done .ph{border-color:var(--dim);filter:saturate(.6) brightness(.8)}
.pol .mark,.pol .new{position:absolute;top:0;left:0;right:0;text-align:center;font-size:15px}
.pol .mark{color:var(--muted)}
.pol .new{color:var(--gold)}
.ghost{position:fixed;z-index:80;pointer-events:none;margin:0}

/* MAP */
.mapgrid{display:grid;grid-template-columns:minmax(0,1.9fr) minmax(0,1fr);gap:28px;align-items:stretch;margin-top:14px}
.plan{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:minmax(200px,auto);border:3px solid var(--fg);margin-top:14px}
.plan.y26{grid-template-columns:repeat(3,minmax(0,1fr))}
.cell{border:2px solid var(--fg);padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-width:0;background:rgba(20,16,70,.55)}
.cell .lbl{text-transform:uppercase;font-size:16px;letter-spacing:.04em}
.cell .sub{font-size:13px;color:var(--muted)}
.cell .who{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;align-items:center;flex:1}
.cell.tall{grid-row:span 2}
.cell.wide{grid-column:span 2}
.cell.hot{border:2px dashed var(--fg);color:var(--cyan)}
.cell .empty{margin:auto;font-size:14px;color:var(--muted);text-align:center}
.inv{align-self:center;background:transparent;border:2px solid var(--cyan);color:var(--cyan);padding:6px 12px;min-height:40px;font-size:15px;animation:blinkb 1.4s steps(1) infinite}
.inv:hover{background:var(--cyan);color:var(--solid)}
@keyframes blinkb{50%{border-color:transparent}}

/* TIME SLIDER — under the people: scrub 2016 moments, last stop jumps to 2026 */
.timeslider{margin-top:clamp(8px,1.4vh,16px);border:3px solid var(--fg);box-shadow:inset 0 0 0 3px var(--solid),inset 0 0 0 5px var(--fg);padding:6px 18px;flex:none;display:grid;grid-template-columns:auto minmax(0,1fr) 9.5em;column-gap:16px;align-items:center}
.timeslider .wtitle{font-size:clamp(15px,1.5vw,20px);grid-row:span 2}
.timeslider output{grid-row:span 2;text-align:right;color:var(--gold);font-size:clamp(15px,1.5vw,20px);font-variant-numeric:tabular-nums}
.timeslider output.y26{color:var(--cyan)}
#timeRange{width:100%;margin:2px 0 0;accent-color:var(--gold);min-height:28px}
#timeRange.y26{accent-color:var(--cyan)}
.tsticks{grid-column:2;display:flex;justify-content:space-between;font-size:13px;color:var(--muted);border-top:2px dashed var(--dim);padding-top:2px}
.tsticks span:last-child{color:var(--cyan)}

/* MEMO — free notes, kept only until reload */
.memo{display:flex;flex-direction:column}
.memo textarea{flex:1;min-height:200px;margin-top:12px;resize:none;background:repeating-linear-gradient(transparent 0 calc(1.6em - 2px),rgba(236,234,255,.12) calc(1.6em - 2px) 1.6em);border:0;border-top:2px dashed var(--dim);padding:6px 2px;color:var(--fg);font:inherit;font-size:clamp(15px,1.4vw,18px);line-height:1.6em;background-attachment:local}
.memo textarea::placeholder{color:var(--dim)}
.memo textarea:focus-visible{outline:none;border-top-color:var(--gold)}
.memo small{color:var(--muted);font-size:13px;margin-top:6px}

/* CHAT — talk to the selected person (UI only, not connected yet) */
.chat{display:flex;flex-direction:column;min-height:220px;margin-top:40px;padding:clamp(14px,2vh,22px) 24px clamp(10px,1.6vh,16px)}
.chatlog{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding-right:6px}
.chatlog .intro{margin:0;font-size:clamp(16px,1.6vw,22px);line-height:1.5}
.msg{max-width:72%;padding:6px 12px;border:2px solid var(--muted);font-size:clamp(15px,1.4vw,18px);line-height:1.45;align-self:flex-start}
.msg b{display:block;font-weight:400;font-size:13px;color:var(--muted)}
.msg.me{align-self:flex-end;border-color:var(--gold);color:var(--gold)}
.chatform{display:flex;gap:10px;margin-top:10px}
.chatform input{flex:1;min-width:0;background:transparent;border:3px solid var(--muted);padding:8px 12px;font-size:16px}
.chatform input:focus-visible{outline:none;border-color:var(--gold)}
.chatform input:disabled{border-color:var(--dim)}
.chatform button{background:transparent;border:3px solid var(--gold);color:var(--gold);padding:0 20px;min-height:44px;text-transform:uppercase;letter-spacing:.06em}
.chatform button:hover:not(:disabled){background:var(--gold);color:var(--solid)}
.chatform button:disabled{border-color:var(--dim);color:var(--dim);cursor:default}
.pol.sel .ph{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold)}
.pol.sel{color:var(--gold)}

/* MAP fits one laptop screen: HUD on top, map + memo fill the rest, chat at the bottom. No page scroll. */
@media (min-width:901px){
  html[data-screen="map"],html[data-screen="map"] body{height:100%;overflow:hidden}
  html[data-screen="map"] body{display:flex;flex-direction:column}
  html[data-screen="map"] #hud{position:relative;flex:none}
  html[data-screen="map"] #hud .wrap{padding-block:10px 4px}
  html[data-screen="map"] .timebox{padding:8px 18px 10px;gap:6px}
  html[data-screen="map"] .navbox{padding:8px 18px}
  html[data-screen="map"] main{flex:1;min-height:0;display:flex}
  html[data-screen="map"] #s-map{flex:1;min-height:0;display:flex}
  #s-map .wrap{flex:1;min-height:0;width:100%;display:grid;padding-block:clamp(8px,1.6vh,14px) clamp(10px,2vh,18px)}
  #s-map .mapgrid{margin-top:0;min-height:0;gap:clamp(16px,2vw,28px)}
  #s-map .mapgrid>.win{min-height:0;display:flex;flex-direction:column;padding:clamp(12px,2vh,22px) clamp(16px,1.8vw,24px)}
  #s-map .plan,#s-map .plan.y26{flex:1;min-height:0;margin-top:clamp(6px,1.2vh,14px);grid-template-columns:repeat(6,minmax(0,1fr));grid-template-rows:minmax(0,1fr)}
  #s-map .cell.tall{grid-row:auto}
  #s-map .plan{container-type:size}
  #s-map .cell{min-height:0;padding:clamp(6px,1vh,10px) 12px;gap:2px;overflow:hidden}
  #s-map .cell .lbl,#s-map .cell .sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}   /* one line each, so every room has the same overhead */
  #s-map .cell .lbl{position:relative}
  /* shortcut: the room-search button is hidden in the one-screen layout until the search screen exists */
  #s-map .cell .inv{display:none}
  /* one portrait size for every room: limited by the row height (minus label, sub line, badge, name) and by a column's width */
  #s-map .pol{padding-top:20px;gap:2px;width:auto;font-size:15px}
  #s-map .pol .ph{width:clamp(40px,min(100cqh - 124px,100cqw / 7 - 24px),96px);height:clamp(40px,min(100cqh - 124px,100cqw / 7 - 24px),96px)}
  #s-map .pol .new,#s-map .pol .mark{font-size:13px}
  #s-map .chat{margin-top:0;min-height:0}
  #s-map .memo textarea{min-height:0}
  #s-map .wrap{grid-template-rows:minmax(0,1fr) clamp(160px,26vh,260px);row-gap:40px}
  #s-map .mapgrid>.win.memo{padding-bottom:clamp(10px,1.6vh,18px)}
}
}

/* VHS */
#vhs{position:fixed;inset:0;z-index:75;pointer-events:none;display:none;overflow:hidden}
#vhs.run{display:block}
#vhs .band{position:absolute;left:0;width:100%;height:12%;background:rgba(236,234,255,.12);animation:band .7s steps(10)}
#vhs .label{position:absolute;top:16%;left:50%;transform:translateX(-50%);font-size:clamp(24px,4vw,44px);letter-spacing:.2em;color:var(--fg);text-shadow:3px 0 var(--red),-3px 0 var(--cyan);white-space:nowrap}
#vhs.run::before{content:"";position:absolute;inset:0;background:rgba(127,214,255,.12);animation:tint .7s steps(4)}
@keyframes band{from{transform:translateY(-120%)}to{transform:translateY(900%)}}
@keyframes tint{0%,100%{opacity:0}30%{opacity:1}}

#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));translate:-50% 0;z-index:95;background:var(--solid);color:var(--fg);border:3px solid var(--fg);padding:10px 16px;font-size:15px;max-width:min(90vw,520px);opacity:0;transition:opacity .2s;pointer-events:none}
#toast.on{opacity:1}

@media (max-width:900px){
  .mapgrid{grid-template-columns:minmax(0,1fr)}
  .plan,.plan.y26{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cell.tall{grid-row:auto}
  .win{padding:18px 16px}
  #hud{position:relative}
  #hud .wrap{gap:10px}
  .timebox{padding:10px 14px 12px;flex:1 1 100%}
  .navbox{padding:6px 14px;font-size:16px;flex:1 1 100%;justify-content:space-between}
  .pol{width:84px}
  .pol .ph{width:76px;height:76px}
  .plan,.plan.y26{grid-auto-rows:minmax(150px,auto)}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<canvas id="noise" width="160" height="90" aria-hidden="true"></canvas>
<div id="vhs" aria-hidden="true"></div>

<header id="hud">
  <div class="wrap">
    <div class="win timebox">
      <div style="display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px"><span class="tt" id="hudTime"></span>
      </div>
      <div class="bars" id="bars"></div>
    </div>
    <nav class="win navbox" aria-label="menu">
      <button data-go="map" aria-current="true">map</button><span class="sep">|</span>
      <button data-soon>case log <b id="logCount">0</b></button><span class="sep">|</span>
      <button data-soon>accuse</button>
    </nav>
  </div>
</header>

<main>
<!-- MAP (main screen) -->
<section id="s-map" class="screen">
  <div class="wrap">
    <div class="mapgrid">
      <div class="win">
        <div style="display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px"><span class="wtitle" id="planTitle"></span><span class="muted" id="planDate"></span></div>
        <div class="plan" id="plan"></div>
        <div class="timeslider">
          <label class="wtitle" for="timeRange">time</label>
          <input type="range" id="timeRange" min="0" max="5" step="1" value="2" aria-describedby="timeOut">
          <output id="timeOut" for="timeRange"></output>
          <div class="tsticks" aria-hidden="true"><span>21:00</span><span>22:30</span><span>22:50</span><span>23:00</span><span>23:23</span><span>2026</span></div>
        </div>
      </div>
      <div class="win memo">
        <label class="wtitle" for="memo">memo</label>
        <textarea id="memo" placeholder="write anything here…&#10;who lied, what time, what to ask next." spellcheck="false"></textarea>
        <small>notes stay until you reload the page.</small>
      </div>
    </div>
    <div class="win chat">
      <span class="win tablabel" id="chatTab">CASE FILE</span>
      <div class="chatlog" id="chatlog" aria-live="polite"></div>
      <form class="chatform" id="chatform">
        <input id="chatInput" autocomplete="off" placeholder="pick someone on the map to talk" aria-label="message" disabled>
        <button id="chatSend" disabled>send</button>
      </form>
    </div>
  </div>
</section>
</main>

<div id="toast" role="status" aria-live="polite"></div>
<div class="scanlines" aria-hidden="true"></div>

<script>
(function(){
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = s => document.querySelector(s);
const h = (tag, attrs, ...kids) => {
  const el = document.createElement(tag);
  for (const k in attrs || {}) {
    if (k === 'class') el.className = attrs[k];
    else if (k === 'text') el.textContent = attrs[k];
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), attrs[k]);
    else el.setAttribute(k, attrs[k]);
  }
  kids.forEach(c => c != null && el.append(c));
  return el;
};

/* ---------- DATA (story facts follow the Notion page) ---------- */
const PEOPLE = {
  jisu:   {name:'Jisu Han',    short:'Jisu',    ini:'JH', r16:'co-founder, cto', r26:'(deceased)',          hair:'#1a1230', suit:'#2f6f8f'},
  dohyun: {name:'Dohyun Kang', short:'Dohyun',  ini:'DK', r16:'ceo, co-founder', r26:'ceo, now a unicorn',  hair:'#2a1d14', suit:'#4a4a6a'},
  minjae: {name:'Minjae Oh',   short:'Minjae',  ini:'MO', r16:'lead developer',  r26:'ceo, nova ai',        hair:'#141018', suit:'#6a3a5a'},
  hana:   {name:'Hana Yoo',    short:'Hana',    ini:'HY', r16:'design intern',   r26:'it reporter',         hair:'#5a2e1a', suit:'#c9a24a'},
  kim:    {name:'Mr. Kim',     short:'Mr. Kim', ini:'MK', r16:'building guard',  r26:'retired',             hair:'#b8b4c8', suit:'#3a5a3a'},
  grace:  {name:'Grace Lee',   short:'Grace',   ini:'GL', r16:'investor',        r26:'investor',            hair:'#3a2418', suit:'#8a2a3a'}
};
const CELLS = {
  '2016':[
    {lbl:'dev room',          people:['minjae'], cls:'tall'},
    {lbl:'ceo office',        people:['dohyun']},
    {lbl:'design desk',       people:['hana']},
    {lbl:'server room',       people:['jisu'], cls:'tall hot', room:true, sub:'deploy-bot logs live here'},
    {lbl:'lobby · guard desk',people:['kim','grace'], cls:'wide', sub:'grace is on the phone line'}
  ],
  '2026':[
    {lbl:'moonlight hq',     sub:'pangyo · a unicorn now',          people:['dohyun']},
    {lbl:'nova ai',          sub:'the competitor',                  people:['minjae']},
    {lbl:'newsroom',         sub:'it desk',                         people:['hana']},
    {lbl:'home',             sub:'retired, wants to talk',          people:['kim']},
    {lbl:'vc office',        sub:'keeps her last email',            people:['grace']},
    {lbl:'evidence storage', sub:'case 2016-0315, boxed since 2016',people:[], cls:'hot', room:true, empty:'(jisu · not reachable)'}
  ]
};
const S = {era:'2016', t:2, visited:new Set(), person:null, chats:{}};
// time slider stops: index → HUD label; the last stop is 2026
const STOPS = ['3/15  21:00','3/15  22:30','3/15  22:50','3/15  23:00','3/15  23:23','NOW  2026'];

/* ---------- SKY (pixel stars, moon, horizon) ---------- */
const sky=$('#sky'), sctx=sky.getContext('2d'); let stars=[], SW=0, SH=0, frame=0;
function sizeSky(){ SW=Math.ceil(innerWidth/3); SH=Math.ceil(innerHeight/3); sky.width=SW; sky.height=SH; stars=[]; for(let i=0;i<SW*SH/90;i++) stars.push({x:Math.random()*SW|0,y:Math.random()*SH*.66|0,b:Math.random(),big:Math.random()<.06}); }
function drawSky(){
  const g=sctx.createLinearGradient(0,0,0,SH*.68); g.addColorStop(0,'#0d0930'); g.addColorStop(1,'#2e238f'); sctx.fillStyle=g; sctx.fillRect(0,0,SW,SH);
  stars.forEach(s=>{ const tw = reduced?1:(.5+.5*Math.sin(frame*.15+s.b*20)); sctx.fillStyle=`rgba(236,234,255,${.35+.65*tw*s.b})`; sctx.fillRect(s.x,s.y,1,1); if (s.big && tw>.6){ sctx.fillRect(s.x-1,s.y,3,1); sctx.fillRect(s.x,s.y-1,1,3); } });
  const mx=SW*.86|0, my=SH*.12|0, r=Math.max(6,SH*.045|0);
  sctx.fillStyle='rgba(245,232,180,.18)'; sctx.beginPath(); sctx.arc(mx,my,r*2.2,0,7); sctx.fill();
  sctx.fillStyle='#f3e7bf'; sctx.beginPath(); sctx.arc(mx,my,r,0,7); sctx.fill(); sctx.fillStyle='#d9cba0'; sctx.fillRect(mx-2,my-1,2,2); sctx.fillRect(mx+2,my+2,3,2);
  // city skyline instead of the sea: low pixel blocks with a few lit windows
  const sy=SH*.68|0; sctx.fillStyle='#120e4c'; sctx.fillRect(0,sy,SW,SH-sy);
  for (let x=0, i=0; x<SW; i++){ const w=8+(i*37%14), bh=10+(i*53%28); sctx.fillStyle='#0b0930'; sctx.fillRect(x,sy-bh,w,bh+2);
    for (let wy=sy-bh+3; wy<sy-2; wy+=4) for (let wx=x+2; wx<x+w-2; wx+=3) if ((wx*7+wy*13+i)%11===0){ sctx.fillStyle='rgba(245,196,81,.55)'; sctx.fillRect(wx,wy,1,1); }
    x+=w+1; }
}
let lastT=0; function skyLoop(t){ if (t-lastT>110){ lastT=t; frame++; drawSky(); } if (!reduced) requestAnimationFrame(skyLoop); }
sizeSky(); drawSky(); if (!reduced) requestAnimationFrame(skyLoop); addEventListener('resize',()=>{ sizeSky(); drawSky(); });

/* ---------- NOISE (radio static) ---------- */
const noise=$('#noise'), nctx=noise.getContext('2d'); let noiseLevel=0, noiseRAF=0;
function noiseTick(){ if (noiseLevel<=0.01){ noise.style.opacity=0; noiseRAF=0; return; } const img=nctx.createImageData(160,90); for (let i=0;i<img.data.length;i+=4){ const v=Math.random()*255|0; img.data[i]=v*.85|0; img.data[i+1]=v*.8|0; img.data[i+2]=v; img.data[i+3]=255; } nctx.putImageData(img,0,0); noise.style.opacity=noiseLevel; noiseRAF=requestAnimationFrame(noiseTick); }
function setNoise(l){ noiseLevel = reduced ? Math.min(l,.15) : l; if (!noiseRAF && noiseLevel>0.01) noiseRAF=requestAnimationFrame(noiseTick); if (noiseLevel<=.01) noise.style.opacity=0; }
function burst(ms){ setNoise(.85); setTimeout(()=>setNoise(0), ms); }

/* ---------- UTIL ---------- */
let toastT; function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'),2600); }
let typeTok=0;
function typeInto(el, text, speed){ const tok=++typeTok; if (reduced){ el.textContent=text; return Promise.resolve(); } el.textContent=''; return new Promise(res=>{ let i=0; (function step(){ if (tok!==typeTok) return res(); el.textContent=text.slice(0, ++i); if (i<text.length) setTimeout(step, speed||22); else res(); })(); }); }
function phEl(k, style){ const p=PEOPLE[k]; return h('div',{class:'ph',text:p.ini,style:`--hair:${p.hair};--suit:${p.suit};${style||''}`}); }

// shortcut: talk, room, case log and accuse screens are not built yet; their entry points show a toast
const soon = () => toast('coming next: this screen is not built yet');
document.addEventListener('click', e=>{ if (e.target.closest('[data-soon]')) soon(); });
function updateHud(){
  $('#hudTime').textContent = (S.era==='2016' ? 'RADIO  ' : '') + STOPS[S.t];
  $('#timeOut').textContent = STOPS[S.t].replace('  ',' ');
  ['#timeOut','#timeRange'].forEach(q=>$(q).classList.toggle('y26', S.era==='2026'));
  const bars=$('#bars'); bars.innerHTML='';
  if (S.era==='2016') ['','','on',''].forEach(c=>bars.append(h('i',{class:c}))); else bars.append(h('i',{class:'on26'}));
}

/* ---------- ERA ---------- */
function setEra(era){
  if (era===S.era) return;
  const vhs=$('#vhs'); vhs.innerHTML='';
  if (!reduced){ for (let i=0;i<4;i++) vhs.append(h('div',{class:'band',style:`top:${i*-30}%;animation-delay:${i*0.08}s`})); vhs.append(h('div',{class:'label',text: era==='2016' ? '◀◀ REWIND 2016' : '▶▶ FWD 2026'})); vhs.classList.add('run'); burst(380); }
  setTimeout(()=>{
    S.era=era;
    if (S.person && !CELLS[era].some(c=>c.people.includes(S.person))) S.person=null;   // jisu is not reachable in 2026
    updateHud(); renderMap(true); renderChat();
  }, reduced?0:230);
  setTimeout(()=>vhs.classList.remove('run'), 720);
}
$('#timeRange').addEventListener('input', e=>{ S.t=+e.target.value; const era = S.t===STOPS.length-1 ? '2026' : '2016'; if (era!==S.era) setEra(era); else updateHud(); });

/* ---------- MAP (main screen) ---------- */
const pols={};
Object.keys(PEOPLE).forEach(k=>{ const b=h('button',{class:'pol','data-p':k,'aria-label':'question '+PEOPLE[k].name}, phEl(k), h('span',{text:PEOPLE[k].short})); b.addEventListener('click', ()=>openTalk(k)); pols[k]=b; });
function openTalk(k){ S.visited.add(k+S.era); S.person=k; polBadges(); renderChat(); $('#chatInput').focus(); }
const status = k => S.visited.has(k+S.era) ? 'some' : 'new';
function polBadges(){ Object.entries(pols).forEach(([k,el])=>{ el.querySelectorAll('.mark,.new').forEach(n=>n.remove()); el.classList.toggle('sel', k===S.person); if (status(k)==='new') el.append(h('span',{class:'new',text:'★ NEW'})); }); }
function renderMap(animate){
  const era=S.era, plan=$('#plan'), first={};
  if (animate) Object.entries(pols).forEach(([k,el])=>{ if (el.isConnected) first[k]=el.getBoundingClientRect(); });
  plan.classList.toggle('y26', era==='2026');
  $('#planTitle').textContent = era==='2016' ? 'Moonlight Labs · Pangyo' : 'Seoul · 2026';
  $('#planDate').textContent = era==='2016' ? '2016-03-15 · 22:50' : 'where are they now';
  plan.innerHTML='';
  const placed=new Set();
  CELLS[era].forEach(c=>{
    const who=h('div',{class:'who'});
    plan.append(h('div',{class:'cell '+(c.cls||'')}, h('span',{class:'lbl',text:c.lbl}), c.sub?h('span',{class:'sub',text:c.sub}):null, who));
    c.people.forEach(p=>{ who.append(pols[p]); placed.add(p); });
    if (c.empty) who.append(h('span',{class:'empty',text:c.empty}));
    if (c.room) who.append(h('button',{class:'inv',text:'search ▶',onclick:soon}));
  });
  polBadges();
  if (animate && !reduced){
    Object.entries(pols).forEach(([k,el])=>{
      const f=first[k];
      if (placed.has(k)){ const l=el.getBoundingClientRect(); if (f) el.animate([{transform:`translate(${f.left-l.left}px,${f.top-l.top}px)`},{transform:'none'}],{duration:900,easing:'steps(12)'}); else el.animate([{opacity:0},{opacity:1}],{duration:600,delay:300,fill:'backwards',easing:'steps(6)'}); }
      else if (f){ const g=el.cloneNode(true); g.classList.add('ghost'); g.style.left=f.left+'px'; g.style.top=f.top+'px'; document.body.append(g); g.animate([{opacity:1},{opacity:0,transform:'translateY(-40px)'}],{duration:1100,easing:'steps(8)'}).onfinish=()=>g.remove(); }
    });
  }
}
/* ---------- CHAT (UI only: messages stay local, nobody answers yet) ---------- */
const INTRO = {
  '2016':'The radio is live. Everyone is honest in 2016, but nobody knows what is coming. Pick someone on the map to talk.',
  '2026':'Ten years later. The survivors remember less and hide more. Ask the same things and listen for what changed.'
};
const chatKey = () => S.person+'-'+S.era;
function renderChat(){
  const log=$('#chatlog'), p=PEOPLE[S.person]; log.innerHTML='';
  $('#chatTab').textContent = p ? `chat · ${p.short} · ${S.era}` : 'CASE FILE';
  $('#chatInput').disabled = $('#chatSend').disabled = !p;
  $('#chatInput').placeholder = p ? `message ${p.short} (${S.era === '2016' ? 'by radio' : 'in person'})…` : 'pick someone on the map to talk';
  if (!p) { log.append(h('p',{class:'intro',text:INTRO[S.era]})); return; }
  const msgs = S.chats[chatKey()] || [];
  if (!msgs.length) log.append(h('p',{class:'intro muted',text:`${p.name} · ${S.era==='2016' ? p.r16 : p.r26}. Ask anything.`}));
  msgs.forEach(m=>log.append(h('div',{class:'msg me'}, h('b',{text:'you'}), m)));
  log.scrollTop=log.scrollHeight;
}
$('#chatform').addEventListener('submit', e=>{
  e.preventDefault();
  const v=$('#chatInput').value.trim(); if (!v || !S.person) return;
  (S.chats[chatKey()] ||= []).push(v);
  $('#chatInput').value=''; renderChat();
});

$('#timeRange').value=S.t; updateHud(); renderMap(false); renderChat();
})();
</script>
</body>
</html>
